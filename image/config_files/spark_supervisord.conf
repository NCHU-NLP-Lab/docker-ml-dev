[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/ml-dev/supervisord.pid
childlogdir=/run/ml-dev

[program:ssh]
command=/usr/sbin/sshd -D -e -f /run/ml-dev/sshd_config
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:jupyter]
command=/usr/local/bin/ml-dev-jupyter lab --config=/etc/ml-dev/jupyter_server_config.py
user=%(ENV_NAME)s
directory=%(ENV_ML_DEV_HOME)s
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:code-server]
command=/usr/bin/code-server --bind-addr 0.0.0.0:%(ENV_VSCODE_PORT)s --auth password --disable-telemetry %(ENV_ML_DEV_HOME)s
user=%(ENV_NAME)s
directory=%(ENV_ML_DEV_HOME)s
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
